[package]
name = "postgraph"
version = "1.0.0"
edition = "2024"

[package.metadata.winres]
ProductName = "PostGraph"
FileDescription = "SMTP to Microsoft Graph API mail proxy, written in rust."
LegalCopyright = "Copyright © 2026"
OriginalFilename = "PostGraph.exe"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
humantime = "2.4.0"
ipnet = "2.12.2"
log = "0.4.33"
pretty_env_logger = "0.5.0"
rand = "0.10.2"
tokio = "1.53.1"

mail_proxy = { path = "../../lib/mail_proxy" }
ms_graph = { path = "../../lib/ms_graph" }

[target.'cfg(windows)'.dependencies]
eventlog = "0.4.0"
windows-service = "0.8.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
