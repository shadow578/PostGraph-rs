[package]
name = "postgraph"
version = "1.0.0"
edition = "2024"

[package.metadata.winres]
ProductName = "PostGraph"
FileDescription = "SMTP to Microsoft Graph API mail proxy, written in rust."
LegalCopyright = "Copyright © 2026"
OriginalFilename = "PostGraph.exe"

[dependencies]
anyhow = "1"
argon2 = { version = "0.6.0" }
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
humantime = "2.4.0"
ipnet = "2.12.2"
log = "0.4.33"
pretty_env_logger = "0.5.0"
rand = "0.10.2"
password-hash = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = "1.53.1"
yaml_serde = "0.10.7"

smtp = { path = "../../lib/smtp" }
ms_graph = { path = "../../lib/ms_graph" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
